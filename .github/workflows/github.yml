name: flutter CI/CD /// first thing name of your CI/CD
on:
  push:
    branches:
      - release
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code

        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter APK
        run: flutter build apk --release
      - name: Upload APK to artifact firebase app distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          app_id: ${{secrets.APP_ID}}
          serviceCredentialsFileContent: ${{secrets.GOOGLE_DISTRIBUTION_KEY}}
          group: testers_1

